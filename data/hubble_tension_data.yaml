# H₀ measurements for AFET β-hierarchy validation (Package 34)
# Sources: Planck 2018, SH0ES (Riess+), various late-universe probes

measurements:
  - name: Planck 2018 (CMB)
    h0_km_s_mpc: 67.4
    uncertainty: 0.5
    domain: early_universe
    beta_domain: cmb
    reference: "Planck Collaboration 2020, A&A 641 A6"

  - name: SH0ES 2022 (Cepheids + SNe Ia)
    h0_km_s_mpc: 73.04
    uncertainty: 1.04
    domain: late_universe
    beta_domain: local
    reference: "Riess et al. 2022, ApJL 934 L7"

  - name: H0LiCOW (strong lensing time delays)
    h0_km_s_mpc: 73.3
    uncertainty: 1.8
    domain: late_universe
    beta_domain: local
    reference: "Wong et al. 2020, MNRAS 498 1420"

  - name: TRGB (Carnegie-Chicago)
    h0_km_s_mpc: 69.8
    uncertainty: 1.9
    domain: late_universe
    beta_domain: intermediate
    reference: "Freedman et al. 2021, ApJ 919 16"

  - name: DESI 2024 (BAO + CMB)
    h0_km_s_mpc: 68.52
    uncertainty: 0.62
    domain: early_universe
    beta_domain: cmb
    reference: "DESI Collaboration 2024, arXiv:2404.03002"

tension_sigma: 5.0  # approximate statistical significance

afet_prediction:
  h0_ref: 70.0
  beta_cmb: 0.05
  beta_local: 1.8
  sigma_phi: 0.0625
  gamma_cosmic: 0.309
  h0_cmb_predicted: 67.4
  h0_local_predicted: 73.0
  h0_ratio_predicted: 1.083
